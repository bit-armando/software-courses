{% extends "base.html" %}

{% block content %}
<div class="container mx-auto py-12">
    <h2 class="text-3xl font-bold mb-6">Historial de Cursos Vistos</h2>
    <ul class="list-disc pl-6">
        {% for entry in history %}
        <li class="mb-2">
            <a href="{% url 'courses:course_detail' entry.course.id %}" class="text-blue-600 hover:underline">
                {{ entry.course.title }}
            </a>
            <p class="text-sm text-gray-500">Visto el {{ entry.viewed_at|date:"d M Y H:i" }}</p>
        </li>
        {% empty %}
        <p>No has visto ningún curso aún.</p>
        {% endfor %}
    </ul>
</div>
{% endblock %}
