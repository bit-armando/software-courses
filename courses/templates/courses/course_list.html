{% extends "base.html" %}

{% block content %}
<div class="container mx-auto py-12">
    <h2 class="text-3xl font-bold mb-6">Lista de Cursos</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for course in courses %}
        <div class="bg-white p-6 rounded shadow hover:shadow-lg transition">
            <h3 class="text-xl font-semibold mb-2">{{ course.title }}</h3>
            <p class="text-gray-600 mb-4">{{ course.short_description }}</p>
            <p><strong>Categoría:</strong> {{ course.category.name }}</p>
            {% if course.video %}
            <a href="{{ course.video.url }}" class="text-blue-600 font-semibold hover:underline">Ver Video</a>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
